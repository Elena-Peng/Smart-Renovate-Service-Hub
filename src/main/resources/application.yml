server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:zhujian}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

ai:
  ark:
    # 火山方舟（豆包大模型）OpenAI 兼容接口配置
    base-url: ${ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
    # 在火山方舟控制台获取 API Key：https://ark.volcengine.com/region:cn-beijing/apikey
    # 请通过环境变量 ARK_API_KEY 注入，不要硬编码在版本库
    api-key: ${ARK_API_KEY:}
    # 模型接入点：当前使用 DeepSeek-V4.1-Flash 经济版（快、便宜、非深度思考）
    model-id: ${ARK_MODEL:deepseek-v4-1-flash-economy-261017}
    timeout-seconds: 90

logging:
  level:
    com.zhujian.platform: INFO
